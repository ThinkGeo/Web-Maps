<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Check if Features Are Equal</title>
    <link rel="stylesheet" href="../lib/maplibre-gl.css">
    <link rel="stylesheet" href="../css/samples.css">
</head>
<body>
    <div class="page">
        <div id="map"></div>
        <aside class="panel narrow">
            <h2>Topologically equal</h2>
            <p>Click a parcel: on the server its own outline becomes the query shape, drawn in red, and every parcel whose geometry is exactly the same - itself, and any duplicate record - is highlighted in blue.</p>
            <div id="result" style="font-weight:600"></div>
        </aside>
    </div>
    <script src="../lib/maplibre-gl.js"></script>
    <script type="module">
        import * as tg from '../js/tg.js';

        const map = tg.createMap({ center: [-10776520, 3919250], zoom: 15 });
        await tg.ready(map);
        tg.vectorOverlay(map, 'zoning', [{ type: 'fill', 'source-layer': 'zoning', paint: { 'fill-color': 'rgba(147,112,219,0.2)', 'fill-outline-color': '#9370DB' } }]);
        const highlighted = tg.geojsonOverlay(map, 'highlighted', [
            { type: 'fill', paint: { 'fill-color': 'rgba(25,25,112,0.35)' } },
            { type: 'line', paint: { 'line-color': '#191970', 'line-width': 2 } },
        ]);
        const query = tg.geojsonOverlay(map, 'query', [{ type: 'line', paint: { 'line-color': '#FF6060', 'line-width': 3 } }]);
        const find = async (lngLat) => {
            const r = await tg.post('samples/shapes/equal', { lng: lngLat && lngLat[0], lat: lngLat && lngLat[1] });
            if (!r.found) return;
            query.setData({ type: 'Feature', geometry: r.query, properties: {} });
            highlighted.setData(r.equal);
            document.getElementById('result').textContent = r.result;
        };
        map.on('click', (e) => find([e.lngLat.lng, e.lngLat.lat]));
        find(null);
    </script>
</body>
</html>
