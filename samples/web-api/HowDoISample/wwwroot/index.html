<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkGeo Web Maps for WebAPI Samples</title>
    <link rel="stylesheet" href="css/lib/bootstrap/bootstrap.min.css">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/media.css" rel="stylesheet">
    <link href="css/gallery.css" rel="stylesheet">
    <link rel="icon" href="images/favicon.png">
</head>
<body>
    <nav class="navbar bg-dark fixed-top">
        <a class="navbar-brand" href="https://thinkgeo.com/"> </a>
        <span class="navbar-text mr-auto">
            <h4>ThinkGeo Web Maps for WebAPI Samples</h4>
            <h6>Maps served by an ASP.NET Core Web API: vector tiles the browser draws, raster tiles the server draws, and the answers behind them</h6>
        </span>
        <button class="navbar-toggler collapsed mr-4" type="button" id="menu-toggle" aria-label="Toggle navigation"><span class="fa fa-bars"></span></button>
        <ul class="navbar-nav">
            <li class="nav-item"><a href="https://thinkgeo.com/gis-ui-web" target="_blank" rel="noopener">ThinkGeo Web Maps</a></li>
            |
            <li class="nav-item"><a href="https://community.thinkgeo.com/" target="_blank" rel="noopener">Support</a></li>
            |
            <li class="nav-item"><a href="https://docs.thinkgeo.com/products/web-maps/" target="_blank" rel="noopener">Docs</a></li>
        </ul>
    </nav>
    <div class="container-fluid">
        <div class="row justify-content-end">
            <div class="sidebar collapse" id="sidebar">
                <ul id="menu-bar" class="nav nav-sidebar"></ul>
            </div>
            <main class="main" id="content">
                <div id="child-page-title" class="pl-md-0 pl-3">
                    <h1>
                        <span class="title" id="sample-title"></span>
                        <a type="button" class="download-sample" target="_blank" id="download-link" href="https://gitlab.com/thinkgeo/public/thinkgeo-web-maps/-/tree/master/samples/web-api/HowDoISample">Download Source</a>
                    </h1>
                    <div class="description-wrap"><p class="sample-description" id="sample-description" style="padding-right: 132px;"></p></div>
                </div>
                <nav class="embed-nav group" id="embed-nav">
                    <ul class="code-types">
                        <li class="code-type"><a href="#" id="tab-client" class="code-tab" role="button" title="Show the page's HTML and script beside it">HTML + JS</a></li>
                        <li class="code-type"><a href="#" id="tab-server" class="code-tab" role="button" title="Show the server's C# beside it">C#</a></li>
                    </ul>
                </nav>
                <div id="output">
                    <div id="razor-box" class="code-wrap code-box box" role="region" aria-label="Source" hidden>
                        <div class="code-file" id="code-file"></div>
                        <pre><code id="code-text"></code></pre>
                    </div>
                    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" hidden></div>
                    <div id="result-box" class="code-box active" role="region" aria-label="Result">
                        <iframe id="result-frame" title="Sample" src="about:blank"></iframe>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/gallery.js"></script>
</body>
</html>
