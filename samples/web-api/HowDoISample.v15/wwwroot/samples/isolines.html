<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Isolines</title>
    <link rel="stylesheet" href="../lib/maplibre-gl.css">
    <link rel="stylesheet" href="../css/samples.css">
</head>
<body>
    <div class="page" style="flex-direction:column">
        <div class="row" style="padding:6px 10px;font-size:12px;background:#f6f6f4;border-bottom:1px solid #ccc;gap:12px">
            <select id="points"><option value="0">real sample data</option><option value="500">500 points (synthetic)</option><option value="2000">2,000 points (synthetic)</option></select>
            <label><input type="checkbox" id="fill"> fill bands</label>
            <label><input type="checkbox" id="labels" checked> labels</label>
            <label><input type="checkbox" id="show-points" checked> data points (&lt;= 2,000)</label>
            <label>levels <input type="range" id="levels" min="2" max="60" step="1" value="25" style="width:120px;vertical-align:middle"> <span id="levels-value">25</span></label>
            <label>width <input type="range" id="width" min="1" max="8" step="1" value="3" style="width:80px;vertical-align:middle"> <span id="width-value">3</span></label>
            <label>power <input type="range" id="power" min="1" max="4" step="0.5" value="2" style="width:80px;vertical-align:middle"> <span id="power-value">2.0</span></label>
        </div>
        <div id="map" style="flex:1;min-height:0"></div>
        <div class="status" id="status" style="padding:4px 10px;font-size:11.5px;background:#f6f6f4;border-top:1px solid #ccc"></div>
    </div>
    <script src="../lib/maplibre-gl.js"></script>
    <script type="module">
        import * as tg from '../js/tg.js';

        const map = tg.createMap({ center: [-10778000, 3912400], zoom: 12 });
        await tg.ready(map);
        const isolines = tg.geojsonOverlay(map, 'isolines', []);
        const points = tg.geojsonOverlay(map, 'points', [{ type: 'circle', paint: { 'circle-color': 'rgba(40,40,40,0.63)', 'circle-radius': 2.5 } }]);
        const status = document.getElementById('status');
        const value = (id) => document.getElementById(id).value;
        let run = 0, framed = false;

        // The field is interpolated on the server; the browser draws the features it traced
        // and reads their level for the colour, the width and the label.
        const apply = async () => {
            const mine = ++run;
            const fill = document.getElementById('fill').checked;
            tg.say(status, 'interpolating on the server...');
            const r = await tg.get(`samples/dynamic/isolines?points=${value('points')}&levelCount=${value('levels')}&fillBands=${fill}&power=${value('power')}`);
            if (mine !== run) return;
            const colorByLevel = ['interpolate', ['linear'], ['to-number', ['get', 'level']], ...r.levels.flatMap((level, i) => [level, r.colors[i]])];
            const layers = [];
            if (fill) layers.push({ type: 'fill', filter: ['==', ['geometry-type'], 'Polygon'], paint: { 'fill-color': colorByLevel, 'fill-opacity': 0.45 } });
            layers.push({ type: 'line', paint: { 'line-color': colorByLevel, 'line-width': +value('width') } });
            if (document.getElementById('labels').checked) layers.push({ type: 'symbol', layout: { 'symbol-placement': 'line', 'text-field': ['get', 'label'], 'text-font': ['Noto Sans Regular'], 'text-size': 11 }, paint: { 'text-color': '#000000', 'text-halo-color': '#FFFFFF', 'text-halo-width': 1.5 } });
            isolines.setLayers(layers);
            isolines.setData(r.isolines);
            points.setData(document.getElementById('show-points').checked ? r.points : null);
            tg.say(status, `${r.count.toLocaleString()} points, ${r.levels.length} levels - IDW on the server: a ${r.resolution}x${r.resolution} grid and ${r.featureCount.toLocaleString()} isoline features in ${r.ms.toLocaleString()} ms; the browser draws them`);
            if (!framed) { framed = true; tg.fit(map, r.bounds, 30); }
        };
        for (const id of ['points', 'fill', 'labels', 'show-points', 'levels', 'width', 'power']) document.getElementById(id).addEventListener('change', apply);
        for (const id of ['levels', 'width']) document.getElementById(id).addEventListener('input', () => document.getElementById(id + '-value').textContent = value(id));
        document.getElementById('power').addEventListener('input', () => document.getElementById('power-value').textContent = (+value('power')).toFixed(1));
        apply();
    </script>
</body>
</html>
