<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vehicle Navigation</title>
    <link rel="stylesheet" href="../lib/maplibre-gl.css">
    <link rel="stylesheet" href="../css/samples.css">
</head>
<body>
    <div class="page">
        <div id="map"></div>
        <div style="position:absolute;top:12px;left:12px">
            <button class="btn" id="mode" style="background:#333;color:#fff;border-color:#333">Overview Mode</button>
        </div>
        <div style="position:absolute;top:12px;right:12px;padding:10px 12px;background:rgba(30,30,30,.85);color:whitesmoke;font:13px system-ui;border-radius:4px">
            <div style="font-weight:600;margin-bottom:6px">Camera</div>
            <label style="display:flex;align-items:center;gap:8px">Pitch <input type="range" id="pitch" min="0" max="80" value="45" style="width:150px"> <span id="pitch-value" style="width:36px">45°</span></label>
            <button class="btn" id="theme" style="margin-top:8px">Dark Theme</button>
        </div>
    </div>
    <script src="../lib/maplibre-gl.js"></script>
    <script type="module">
        import * as tg from '../js/tg.js';

        const scale = 5000, stepMs = 1500;
        const route = await tg.get('samples/navigation/vehicle-route');
        const points = route.features.find(f => f.properties.Kind === 'route').geometry.coordinates;
        const map = tg.createMap({ center: tg.toMeters(points[0][0], points[0][1]), zoom: 17, pitch: 45 });
        let dark = false, overview = false, vehicle, trail;

        // Light and dark are the same tiles restyled; the route colours follow the theme. The
        // overlays are put back whenever the style changes, so a theme switch keeps them.
        const overlays = async () => {
            const routeColor = dark ? '#41F3FF' : '#FFD400', visited = dark ? '#21FF8F' : '#008000';
            const destination = dark ? 'rgba(33,255,143,0.27)' : 'rgba(0,150,60,0.27)';
            tg.geojsonOverlay(map, 'route', [
                { type: 'fill', filter: ['==', ['get', 'Kind'], 'destination'], paint: { 'fill-color': destination } },
                { type: 'line', filter: ['==', ['get', 'Kind'], 'route'], paint: { 'line-color': routeColor, 'line-width': 6 } },
            ], route);
            trail = tg.geojsonOverlay(map, 'trail', [{ type: 'line', paint: { 'line-color': visited, 'line-width': 6 } }], trail && trail.data);
            if (!map.hasImage('vehicle')) map.addImage('vehicle', (await map.loadImage('../images/vehicle_location.png')).data);
            // The vehicle points the way it is heading; the picture turns with the map, so in
            // tracking mode - the map turned to the heading - it points up the screen.
            vehicle = tg.geojsonOverlay(map, 'vehicle', [{ type: 'symbol', layout: { 'icon-image': 'vehicle', 'icon-allow-overlap': true, 'icon-rotate': ['get', 'heading'], 'icon-rotation-alignment': 'map' } }], vehicle && vehicle.data);
        };
        // style.load fires for the first style as well as for every switch.
        map.on('style.load', overlays);
        await tg.ready(map);

        // One GPS point to the next every 1.5 seconds: the camera eases to the point at a steady
        // pace, turned to the vehicle's heading with the vehicle 200 pixels below the centre of
        // the screen, and the vehicle is moved along the segment at the same pace.
        const heading = (a, b) => { const [ax, ay] = tg.toMeters(a[0], a[1]), [bx, by] = tg.toMeters(b[0], b[1]); return Math.atan2(bx - ax, by - ay) * 180 / Math.PI; };
        const visited = [];
        const place = (lngLat, h) => {
            if (!vehicle || !trail) return;
            const data ={ type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: lngLat }, properties: { heading: h } }] };
            vehicle.data = data; vehicle.setData(data);
            const line = { type: 'Feature', geometry: { type: 'LineString', coordinates: visited.length >= 2 ? visited : [lngLat, lngLat] }, properties: {} };
            trail.data = line; trail.setData(line);
        };
        (async () => {
            for (let i = 1; i < points.length; i++) {
                const from = points[i - 1], to = points[i], h = heading(from, to);
                if (!overview) {
                    const ahead = 200 * tg.resolutionForScale(scale), r = h * Math.PI / 180;
                    const [tx, ty] = tg.toMeters(to[0], to[1]);
                    map.easeTo({ center: tg.toLngLat(tx + ahead * Math.sin(r), ty + ahead * Math.cos(r)), bearing: h, zoom: tg.zoomForScale(scale), duration: stepMs, easing: t => t });
                }
                const started = performance.now();
                while (true) {
                    const progress = Math.min(1, (performance.now() - started) / stepMs);
                    const at = [from[0] + (to[0] - from[0]) * progress, from[1] + (to[1] - from[1]) * progress];
                    if (visited.length >= i) visited.pop();
                    visited.push(at);
                    place(at, h);
                    if (progress >= 1) break;
                    await new Promise(r => setTimeout(r, 50));
                }
            }
        })();

        document.getElementById('mode').addEventListener('click', (e) => {
            overview = !overview;
            e.target.textContent = overview ? 'Tracking Mode' : 'Overview Mode';
            // The whole route, zoomed out by half.
            if (overview) map.fitBounds(points.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(points[0], points[0])), { padding: 80, bearing: 0, duration: 1000 });
        });
        document.getElementById('pitch').addEventListener('input', (e) => { document.getElementById('pitch-value').textContent = e.target.value + '°'; map.setPitch(+e.target.value); });
        document.getElementById('theme').addEventListener('click', (e) => {
            dark = !dark;
            e.target.textContent = dark ? 'Light Theme' : 'Dark Theme';
            map.setStyle(`https://cdn.thinkgeo.com/worldstreets-gl-styles/1.0.0/${dark ? 'dark' : 'light'}.json`);
        });
    </script>
</body>
</html>
