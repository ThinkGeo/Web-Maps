<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elevation</title>
    <link rel="stylesheet" href="../lib/maplibre-gl.css">
    <link rel="stylesheet" href="../css/samples.css">
</head>
<body>
    <div class="page">
        <div id="map"></div>
        <aside class="panel narrow" style="width:340px">
            <h2>Elevation</h2>
            <p>A point, a line or an area drawn on the map goes to the server, where ElevationCloudClient samples it; a line or an area is sampled every few meters and each sample comes back with its height.</p>
            <div class="row">
                <button class="btn" id="point">Point</button><button class="btn" id="line">Line</button><button class="btn" id="polygon">Area</button>
                <label>every <input type="number" id="interval" min="10" max="500" step="10" value="50"> m</label>
            </div>
            <div class="status" id="status">Choose Point, Line or Area and draw on the map.</div>
            <svg id="profile" viewBox="0 0 320 130" style="width:100%;background:#fff;border:1px solid #ddd" hidden>
                <polyline id="profile-line" fill="rgba(31,58,147,0.15)" stroke="#1F3A93" stroke-width="1.5"></polyline>
                <text id="profile-high" x="4" y="12" font-size="10" fill="#555"></text>
                <text id="profile-low" x="4" y="126" font-size="10" fill="#555"></text>
            </svg>
            <div id="summary" style="color:#555"></div>
        </aside>
    </div>
    <script src="../lib/maplibre-gl.js"></script>
    <script type="module">
        import * as tg from '../js/tg.js';

        const map = tg.createMap({ center: [-10776981, 3912345], zoom: 15 });
        await tg.ready(map);
        const asked = tg.geojsonOverlay(map, 'asked', [
            { type: 'fill', filter: ['==', ['geometry-type'], 'Polygon'], paint: { 'fill-color': 'rgba(30,90,220,0.08)' } },
            { type: 'line', paint: { 'line-color': '#1E5ADC', 'line-width': 2 } },
        ]);
        const sampleLayers = (colour) => [
            { type: 'circle', paint: { 'circle-radius': 5, 'circle-color': colour, 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 1 } },
            { type: 'symbol', minzoom: 16, layout: { 'text-field': ['get', 'feet'], 'text-font': ['Noto Sans Bold'], 'text-size': 10, 'text-offset': [0, -1], 'text-anchor': 'bottom' }, paint: { 'text-color': '#333333', 'text-halo-color': '#FFFFFF', 'text-halo-width': 1 } },
        ];
        const samples = tg.geojsonOverlay(map, 'samples', sampleLayers('#1F3A93'));
        const status = document.getElementById('status');
        let cancel = null;

        const ask = async (geometry) => {
            tg.say(status, 'asking ThinkGeo Cloud...');
            asked.setData({ type: 'Feature', geometry, properties: {} });
            samples.clear();
            document.getElementById('profile').hidden = true;
            document.getElementById('summary').textContent = '';
            try {
                const result = await tg.post('samples/cloud/elevation', { geometry, interval: +document.getElementById('interval').value });
                const { lowest, highest } = result;
                // The samples coloured low to high, unless they are all the same height.
                samples.setLayers(sampleLayers(highest - lowest < 0.5 ? '#1F3A93' : ['interpolate', ['linear'], ['to-number', ['get', 'feet']], lowest, '#2C7BB6', (lowest + highest) / 2, '#FFFFBF', highest, '#D7191C']));
                samples.setData({ type: 'FeatureCollection', features: result.samples.map(s => ({ type: 'Feature', geometry: { type: 'Point', coordinates: s.at }, properties: { feet: Math.round(s.feet) } })) });
                if (geometry.type === 'LineString' && result.samples.length > 1) {
                    // The samples along the line as a polyline in a 320 x 130 box: distance across, height up.
                    const span = Math.max(1, highest - lowest);
                    const points = result.samples.map((s, i) => `${(4 + 312 * i / (result.samples.length - 1)).toFixed(1)},${(122 - 108 * (s.feet - lowest) / span).toFixed(1)}`);
                    document.getElementById('profile-line').setAttribute('points', `4,126 ${points.join(' ')} 316,126`);
                    document.getElementById('profile-high').textContent = `${Math.round(highest)} ft`;
                    document.getElementById('profile-low').textContent = `${Math.round(lowest)} ft`;
                    document.getElementById('profile').hidden = false;
                }
                document.getElementById('summary').textContent = `Average ${result.average.toFixed(1)} ft, highest ${highest.toFixed(1)} ft, lowest ${lowest.toFixed(1)} ft, ${result.samples.length} samples.`;
                tg.say(status, `${result.samples.length} samples.`);
            } catch (e) {
                tg.say(status, e.message, false);
            }
        };
        for (const mode of ['point', 'line', 'polygon']) {
            document.getElementById(mode).addEventListener('click', () => {
                if (cancel) cancel();
                for (const m of ['point', 'line', 'polygon']) document.getElementById(m).classList.toggle('primary', m === mode);
                cancel = tg.draw(map, mode, (feature) => { cancel = null; for (const m of ['point', 'line', 'polygon']) document.getElementById(m).classList.remove('primary'); ask(feature.geometry); });
            });
        }
        const first = [[-10776298, 3912306], [-10776496, 3912399], [-10776675, 3912478], [-10776890, 3912516], [-10777189, 3912509], [-10777329, 3912442], [-10777536, 3912318]].map(p => tg.toLngLat(p[0], p[1]));
        ask({ type: 'LineString', coordinates: first });
    </script>
</body>
</html>
