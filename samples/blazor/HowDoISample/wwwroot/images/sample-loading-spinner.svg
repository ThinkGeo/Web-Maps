<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">Routing service area loading</title>
  <style>
    .spinner {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 1s steps(12, end) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>

  <!-- The rotating radial marks form the loading indicator around a transparent center. -->
  <g class="spinner" fill="#596263">
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" opacity=".28"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(30 48 48)" opacity=".34"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(60 48 48)" opacity=".40"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(90 48 48)" opacity=".46"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(120 48 48)" opacity=".52"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(150 48 48)" opacity=".60"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(180 48 48)" opacity=".68"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(210 48 48)" opacity=".76"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(240 48 48)" opacity=".84"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(270 48 48)" opacity=".92"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(300 48 48)"/>
    <rect x="45.5" y="2.5" width="5" height="26" rx="2.5" transform="rotate(330 48 48)" opacity=".20"/>
  </g>
</svg>
