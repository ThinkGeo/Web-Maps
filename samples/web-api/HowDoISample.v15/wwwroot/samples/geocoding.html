<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Geocoding</title>
    <link rel="stylesheet" href="../lib/maplibre-gl.css">
    <link rel="stylesheet" href="../css/samples.css">
</head>
<body>
    <div class="page">
        <div id="map"></div>
        <aside class="panel narrow" style="width:340px">
            <h2>Geocoding</h2>
            <p>An address or a place name goes to the server, where GeocodingCloudClient.SearchAsync asks ThinkGeo Cloud; every match comes back as a point, a bounding box and its properties.</p>
            <input type="text" id="text" value="Frisco Square" placeholder="Address or place">
            <div class="row"><label>Up to <input type="number" id="max" min="1" max="50" value="10"> results</label><label><input type="checkbox" id="inview"> in the current view</label></div>
            <button class="btn primary" id="search" style="align-self:flex-start">Search</button>
            <div class="status" id="status"></div>
            <div class="list" id="found"></div>
        </aside>
    </div>
    <script src="../lib/maplibre-gl.js"></script>
    <script type="module">
        import * as tg from '../js/tg.js';

        const map = tg.createMap({ center: [-10778720, 3915154], zoom: 11 });
        await tg.ready(map);
        const hits = tg.geojsonOverlay(map, 'hits', [{ type: 'circle', paint: { 'circle-radius': 6, 'circle-color': '#D7301F', 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 2 } }]);
        const picked = tg.geojsonOverlay(map, 'picked', [
            { type: 'circle', paint: { 'circle-radius': 11, 'circle-color': 'rgba(215,48,31,0.25)', 'circle-stroke-color': '#D7301F', 'circle-stroke-width': 2 } },
            { type: 'symbol', layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Bold'], 'text-size': 12, 'text-offset': [0, 1.4], 'text-anchor': 'top' }, paint: { 'text-color': '#7A1A0E', 'text-halo-color': '#FFFFFF', 'text-halo-width': 1.5 } },
        ]);
        const status = document.getElementById('status'), list = document.getElementById('found');
        const point = (location) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: location.point }, properties: { name: location.name } });

        const pick = (location, row) => {
            for (const r of list.children) r.classList.toggle('picked', r === row);
            picked.setData(point(location));
            if (location.bounds) tg.fit(map, location.bounds, 40);
            else map.easeTo({ center: location.point, zoom: tg.zoomForScale(4500) });
        };
        const search = async () => {
            const text = document.getElementById('text').value.trim();
            if (!text) return;
            tg.say(status, 'asking ThinkGeo Cloud...');
            try {
                const result = await tg.post('samples/cloud/geocode', { text, maxResults: +document.getElementById('max').value, bbox: document.getElementById('inview').checked ? tg.bboxOf(map) : null });
                list.innerHTML = '';
                hits.setData({ type: 'FeatureCollection', features: result.locations.map(point) });
                picked.clear();
                tg.say(status, result.locations.length === 0 ? 'Nothing matched.' : `${result.locations.length} matching locations - click one.`);
                for (const location of result.locations) {
                    const row = document.createElement('div');
                    row.innerHTML = `<div>${location.name}</div><small>${location.type || ''}</small>`;
                    row.addEventListener('click', () => pick(location, row));
                    list.appendChild(row);
                }
                if (result.locations.length) pick(result.locations[0], list.firstChild);
            } catch (e) {
                tg.say(status, e.message, false);
            }
        };
        document.getElementById('search').addEventListener('click', search);
        document.getElementById('text').addEventListener('keyup', (e) => { if (e.key === 'Enter') search(); });
    </script>
</body>
</html>
