<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geocoding</title>
    <link rel="stylesheet" href="../lib/maplibre-gl.css">
    <link rel="stylesheet" href="../css/samples.css">
</head>
<body>
    <div class="page">
        <div id="map"></div>
        <aside class="panel narrow" style="width:340px">
            <h2>Geocoding, both directions</h2>
            <label><input type="radio" name="way" value="forward" checked> A name in, a place out</label>
            <label><input type="radio" name="way" value="reverse"> A place in, a name out</label>
            <p id="note" style="margin-top:2px"></p>
            <div id="forward-box" style="display:flex;flex-direction:column;gap:8px">
                <input type="text" id="text" value="Frisco Square" placeholder="Address or place">
                <div class="row"><label>Up to <input type="number" id="max" min="1" max="50" value="10"> results</label><label><input type="checkbox" id="inview"> in the current view</label></div>
                <button class="btn primary" id="search" style="align-self:flex-start">Search</button>
            </div>
            <div id="reverse-box" style="display:none;flex-direction:column;gap:8px">
                <div class="row"><input type="text" id="coordinates" value="33.150083, -96.834516" placeholder="latitude, longitude" style="flex:1"><button class="btn primary" id="look">Search</button></div>
                <div class="row"><label>Radius <input type="number" id="radius" min="10" max="2000" step="10" value="200"> m</label><label>Up to <input type="number" id="reverse-max" min="1" max="50" value="20"></label></div>
            </div>
            <div class="status" id="status"></div>
            <div class="list" id="found"></div>
            <div id="nearby"></div>
        </aside>
    </div>
    <script src="../lib/maplibre-gl.js"></script>
    <script type="module">
        import * as tg from '../js/tg.js';

        // Two cloud clients, one on each side of the same question. Either way the browser only
        // ever talks to this server, and the credentials never leave it.
        const notes = {
            forward: 'An address or a place name goes to the server, where GeocodingCloudClient.SearchAsync asks ThinkGeo Cloud; every match comes back as a point, a bounding box and its properties.',
            reverse: 'A point and a search radius go to the server, where ReverseGeocodingCloudClient.SearchPointAsync answers with the best match and whatever else lies inside the radius. Click the map, or type a latitude and longitude.',
        };

        const map = tg.createMap({ center: [-10778720, 3915154], zoom: 11 });
        await tg.ready(map);
        const hits = tg.geojsonOverlay(map, 'hits', [{ type: 'circle', paint: { 'circle-radius': 6, 'circle-color': '#D7301F', 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 2 } }]);
        const asked = tg.geojsonOverlay(map, 'asked', [{ type: 'fill', paint: { 'fill-color': 'rgba(30,90,220,0.08)', 'fill-outline-color': 'rgba(30,90,220,0.6)' } }]);
        const picked = tg.geojsonOverlay(map, 'picked', [
            { type: 'fill', filter: ['==', ['geometry-type'], 'Polygon'], paint: { 'fill-color': 'rgba(147,112,219,0.35)', 'fill-outline-color': '#9370DB' } },
            { type: 'line', filter: ['==', ['geometry-type'], 'LineString'], paint: { 'line-color': '#9370DB', 'line-width': 5 } },
            { type: 'circle', filter: ['==', ['geometry-type'], 'Point'], paint: { 'circle-radius': 11, 'circle-color': 'rgba(215,48,31,0.25)', 'circle-stroke-color': '#D7301F', 'circle-stroke-width': 2 } },
            { type: 'symbol', filter: ['==', ['geometry-type'], 'Point'], layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Bold'], 'text-size': 12, 'text-offset': [0, 1.4], 'text-anchor': 'top' }, paint: { 'text-color': '#7A1A0E', 'text-halo-color': '#FFFFFF', 'text-halo-width': 1.5 } },
        ]);
        const center = tg.geojsonOverlay(map, 'center', [{ type: 'circle', paint: { 'circle-radius': 5, 'circle-color': '#D7301F', 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 2 } }]);
        const status = document.getElementById('status'), list = document.getElementById('found'), nearby = document.getElementById('nearby');
        let way = 'forward', popup = null, busy = false;

        const forget = () => {
            hits.clear(); asked.clear(); picked.clear(); center.clear();
            list.innerHTML = ''; nearby.innerHTML = '';
            if (popup) { popup.remove(); popup = null; }
        };
        const point = (location) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: location.point }, properties: { name: location.name } });

        const pick = (location, row) => {
            for (const other of list.children) other.classList.toggle('picked', other === row);
            picked.setData(point(location));
            if (location.bounds) tg.fit(map, location.bounds, 40);
            else map.easeTo({ center: location.point, zoom: tg.zoomForScale(4500) });
        };
        const search = async () => {
            const text = document.getElementById('text').value.trim();
            if (!text) return;
            tg.say(status, 'asking ThinkGeo Cloud...');
            try {
                const result = await tg.post('samples/cloud/geocode', { text, maxResults: +document.getElementById('max').value, bbox: document.getElementById('inview').checked ? tg.bboxOf(map) : null });
                list.innerHTML = '';
                hits.setData({ type: 'FeatureCollection', features: result.locations.map(point) });
                picked.clear();
                tg.say(status, result.locations.length === 0 ? 'Nothing matched.' : `${result.locations.length} matching locations - click one.`);
                for (const location of result.locations) {
                    const row = document.createElement('div');
                    row.innerHTML = `<div>${location.name}</div><small>${location.type || ''}</small>`;
                    row.addEventListener('click', () => pick(location, row));
                    list.appendChild(row);
                }
                if (result.locations.length) pick(result.locations[0], list.firstChild);
            } catch (e) {
                tg.say(status, e.message, false);
            }
        };

        const ask = async (lngLat) => {
            if (busy) return;
            busy = true;
            tg.say(status, 'asking ThinkGeo Cloud...');
            center.setData({ type: 'Feature', geometry: { type: 'Point', coordinates: lngLat }, properties: {} });
            picked.clear(); nearby.innerHTML = '';
            if (popup) { popup.remove(); popup = null; }
            try {
                const result = await tg.post('samples/cloud/reverse-geocode', { lng: lngLat[0], lat: lngLat[1], radius: +document.getElementById('radius').value, maxResults: +document.getElementById('reverse-max').value });
                asked.setData({ type: 'Feature', geometry: result.circle, properties: {} });
                if (result.best) popup = tg.popup(map, result.best.at, `<b>Best match</b><br>${result.best.text}`);
                // What came back, sorted into the three kinds of thing an address can sit next to.
                const groups = {};
                for (const location of result.nearby) {
                    const category = (location.category || '').toLowerCase();
                    const group = category.includes('addresspoint') ? 'Addresses' : ['road', 'rail', 'aeroway', 'waterway'].includes(category) ? 'Roads and ways' : 'Places';
                    (groups[group] = groups[group] || []).push(location);
                }
                for (const group of Object.keys(groups).sort()) {
                    const head = document.createElement('div'); head.style.cssText = 'font-weight:600;margin-top:6px'; head.textContent = group; nearby.appendChild(head);
                    const rows = document.createElement('div'); rows.className = 'list'; nearby.appendChild(rows);
                    for (const location of groups[group]) {
                        const row = document.createElement('div');
                        row.innerHTML = `<div>${location.text}</div><small>${location.type}, ${Math.round(location.distance)} m ${location.direction}</small>`;
                        row.addEventListener('click', () => { for (const other of nearby.querySelectorAll('.list > div')) other.classList.toggle('picked', other === row); picked.setData({ type: 'Feature', geometry: location.geometry, properties: {} }); });
                        rows.appendChild(row);
                    }
                }
                tg.say(status, result.best ? `${result.nearby.length} nearby locations - click one.` : 'Nothing within the radius.');
            } catch (e) {
                tg.say(status, e.message, false);
            }
            busy = false;
        };

        const look = () => {
            const parts = document.getElementById('coordinates').value.split(',').map(Number);
            if (parts.length !== 2 || parts.some(isNaN) || Math.abs(parts[0]) > 85 || Math.abs(parts[1]) > 180) { tg.say(status, 'Type a latitude and a longitude, separated by a comma.', false); return; }
            map.easeTo({ center: [parts[1], parts[0]] });
            ask([parts[1], parts[0]]);
        };

        const show = () => {
            forget();
            document.getElementById('note').textContent = notes[way];
            document.getElementById('forward-box').style.display = way === 'forward' ? 'flex' : 'none';
            document.getElementById('reverse-box').style.display = way === 'reverse' ? 'flex' : 'none';
            if (way === 'forward') { map.easeTo({ zoom: 11, duration: 400 }); search(); }
            else { map.easeTo({ zoom: 14, duration: 400 }); tg.say(status, 'Click anywhere on the map, or search for a place by its coordinates.'); }
        };

        map.on('click', (event) => {
            if (way !== 'reverse') return;
            document.getElementById('coordinates').value = `${event.lngLat.lat.toFixed(6)}, ${event.lngLat.lng.toFixed(6)}`;
            ask([event.lngLat.lng, event.lngLat.lat]);
        });
        document.getElementById('search').addEventListener('click', search);
        document.getElementById('text').addEventListener('keyup', (event) => { if (event.key === 'Enter') search(); });
        document.getElementById('look').addEventListener('click', look);
        document.getElementById('coordinates').addEventListener('keyup', (event) => { if (event.key === 'Enter') look(); });
        for (const radio of document.querySelectorAll('input[name=way]')) radio.addEventListener('change', () => { if (radio.checked) { way = radio.value; show(); } });
        show();
    </script>
</body>
</html>
