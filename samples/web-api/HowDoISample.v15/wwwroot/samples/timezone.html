<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Timezone</title>
    <link rel="stylesheet" href="../lib/maplibre-gl.css">
    <link rel="stylesheet" href="../css/samples.css">
</head>
<body>
    <div class="page">
        <div id="map"></div>
        <aside class="panel narrow">
            <h2>Time zone</h2>
            <p>Click anywhere: the point goes to the server, where TimeZoneCloudClient.GetTimeZoneByCoordinateAsync answers with the zone, the local time there and the zone's outline.</p>
            <div class="status" id="status"></div>
        </aside>
    </div>
    <script src="../lib/maplibre-gl.js"></script>
    <script type="module">
        import * as tg from '../js/tg.js';

        const map = tg.createMap({ center: [-10618080, 4557170], zoom: 4 });
        await tg.ready(map);
        const zone = tg.geojsonOverlay(map, 'zone', [
            { type: 'fill', paint: { 'fill-color': 'rgba(147,112,219,0.22)', 'fill-outline-color': '#9370DB' } },
            { type: 'line', paint: { 'line-color': '#9370DB', 'line-width': 1.5 } },
        ]);
        const asked = tg.geojsonOverlay(map, 'asked', [{ type: 'circle', paint: { 'circle-radius': 6, 'circle-color': '#6A3DB8', 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 2 } }]);
        const status = document.getElementById('status');
        let popup = null, busy = false;
        const ask = async (lngLat) => {
            if (busy) return;
            busy = true;
            tg.say(status, 'asking ThinkGeo Cloud...');
            asked.setData({ type: 'Feature', geometry: { type: 'Point', coordinates: lngLat }, properties: {} });
            try {
                const result = await tg.post('samples/cloud/timezone', { lng: lngLat[0], lat: lngLat[1] });
                if (popup) popup.remove();
                popup = tg.popup(map, lngLat, `<b>${result.timeZone}</b><br>Local time ${result.localTime}<br>UTC${result.offset}, daylight saving ${result.daylightSaving ? 'on' : 'off'}`);
                zone.setData(result.shape ? { type: 'Feature', geometry: result.shape, properties: {} } : null);
                tg.say(status, `${result.timeZone}, ${result.country}.`);
            } catch (e) {
                tg.say(status, e.message, false);
            }
            busy = false;
        };
        map.on('click', (e) => ask([e.lngLat.lng, e.lngLat.lat]));
        ask(tg.toLngLat(-10779572.80, 3915268.68));
    </script>
</body>
</html>
