<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ThinkGeo Web API Quick Start</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 800px; height: 600px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Create the map.
        var map = L.map('map').setView([33.1010, -96.8134], 4);

        // Add ThinkGeo Cloud Maps aerial imagery as the background map.
        var cloudApiKey = 'PIbGd76RyHKod99KptWTeb-Jg9JUPEPUBFD3SZJYLDE~';
        L.tileLayer('https://cloud.thinkgeo.com/api/v2/maps/raster/aerial/x1/3857/512/{z}/{x}/{y}.jpeg?apikey=' + cloudApiKey).addTo(map);

        // Add the capitals, drawn by the MapService controller of your Web API project.
        L.tileLayer('http://localhost:5196/api/mapservice/{z}/{x}/{y}').addTo(map);
    </script>
</body>
</html>
