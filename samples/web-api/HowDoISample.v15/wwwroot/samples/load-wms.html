<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Work with OGC Services</title>
    <link rel="stylesheet" href="../lib/maplibre-gl.css">
    <link rel="stylesheet" href="../css/samples.css">
</head>
<body>
    <div class="page">
        <div id="map"></div>
        <aside class="panel narrow">
            <h2>OGC web services</h2>
            <p>A WMS layer (mundialis OSM-WMS) and a WMTS layer (Swisstopo's 1:25,000 map), each a layer on the server drawn tile by tile at raster/wms/ and raster/wmts/. The server asks the service for each tile's extent; the browser only sees PNG tiles.</p>
            <label><input type="checkbox" id="wms" checked> WMS - ows.mundialis.de OSM-WMS</label>
            <label><input type="checkbox" id="wmts" checked> WMTS - wmts.geo.admin.ch pixelkarte-farbe-pk25</label>
            <div class="row"><button class="btn" id="usa">United States</button><button class="btn" id="swiss">Switzerland</button></div>
            <div class="status" id="status"></div>
        </aside>
    </div>
    <script src="../lib/maplibre-gl.js"></script>
    <script type="module">
        import * as tg from '../js/tg.js';

        const map = tg.createMap({ center: [-11037792, 4953010], zoom: 5, basemap: null });
        await tg.ready(map);
        const overlays = {};
        const apply = () => {
            for (const id of ['wms', 'wmts']) {
                const on = document.getElementById(id).checked;
                if (on && !overlays[id]) overlays[id] = tg.rasterOverlay(map, id);
                if (!on && overlays[id]) { overlays[id].remove(); delete overlays[id]; }
            }
        };
        for (const id of ['wms', 'wmts']) document.getElementById(id).addEventListener('change', apply);
        apply();
        document.getElementById('usa').addEventListener('click', () => map.easeTo({ center: tg.toLngLat(-11037792, 4953010), zoom: 4 }));
        document.getElementById('swiss').addEventListener('click', () => map.easeTo({ center: tg.toLngLat(920000, 5950000), zoom: 9 }));
    </script>
</body>
</html>
